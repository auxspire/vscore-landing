# Sync worldcup26.ir → Supabase every 15 minutes (Vercel Hobby allows only daily crons).
name: Sync football data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set"
            exit 1
          fi
          curl -sfS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://vscor.in/api/sync-football-data?job=all"

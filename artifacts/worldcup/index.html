      crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --lime: #adff2f;
        --bg: #0a0a0b;
        --muted: #a1a1aa;
        --border: #27272a;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: var(--bg);
        color: #fafafa;
      }
      #static-fallback {
        max-width: 42rem;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 2rem;
      }
      #static-fallback header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      #static-fallback .brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
      }
      #static-fallback .brand img {
        height: 36px;
        width: auto;
      }
      #static-fallback h1 {
        font-size: 1.75rem;
        line-height: 1.15;
        letter-spacing: -0.03em;
        margin: 0 0 0.75rem;
      }
      #static-fallback p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 1rem;
      }
      #static-fallback nav a {
        display: block;
        padding: 0.85rem 1rem;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
        margin-bottom: 0.65rem;
        text-align: center;
      }
      #static-fallback .btn-matchup {
        background: #000;
        color: var(--lime);
        border: 1px solid rgba(173, 255, 47, 0.35);
      }
      #static-fallback .btn-path {
        background: var(--lime);
        color: #000;
      }
      #static-fallback .home-link {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--muted);
        text-decoration: none;
      }
      #static-fallback .home-link:hover {
        color: #fff;
      }
      #root .app-loading {
        max-width: 48rem;
        margin: 0 auto;
        padding: 1.5rem 1.25rem;
      }
      #root .skel {
        background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
        background-size: 200% 100%;
        animation: shimmer 1.2s infinite;
        border-radius: 12px;
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      #root .skel-nav { height: 56px; margin-bottom: 1.5rem; }
      #root .skel-hero { height: 120px; margin-bottom: 1rem; }
      #root .skel-btn { height: 52px; margin-bottom: 0.65rem; border-radius: 999px; }
      #root .skel-card { height: 96px; margin-bottom: 0.75rem; }
    </style>
  </head>
  <body>
  <div id="static-fallback" aria-hidden="true">
    <header>
      <div class="brand">
        <img src="/worldcup/wc26-sticker-matchup.png" width="40" height="40" alt="" />
        <strong>Matchup Predictor</strong>
      </div>
      <a class="home-link" href="https://vscor.in/">← VScor home</a>
    </header>
    <h1>World Cup 2026 Match Predictor</h1>
    <p>
      Run 10,000 Monte Carlo simulations to find the probability of any two teams meeting
      at each stage of the tournament. Explore bracket paths to the final and browse power
      rankings for all 48 nations.
    </p>
    <nav>
      <a class="btn-matchup" href="/worldcup/#predictor">Matchup Predictor</a>
      <a class="btn-path" href="/worldcup/bracket">Path to Final</a>
    </nav>
  </div>

  <div id="root">
    <div class="app-loading" aria-busy="true" aria-label="Loading Matchup Predictor">
      <div class="skel skel-nav"></div>
      <div class="skel skel-hero"></div>
      <div class="skel skel-btn"></div>
      <div class="skel skel-btn"></div>
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
    </div>
  </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
